AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ElastiCache Redis - Cluster Mode Disabled. #change this? DynamoDB sessions store 

Parameters:
  Environment:
    Description: "The name of the environment to deploy to"
    Type: "String"
    Default: build
    AllowedValues:
      - "dev"
      - "build"
      - "staging"
      - "integration"
      - "production"

  VpcStackName:
    Description: "The name of the stack that defines the VPC where this Redis cluster will be deployed"
    Type: String
    Default: "vpc-enhanced"

  NodeCount:
    Description: "Number of Cache Cluster required - one per AZ"
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 6

  ProductTagValue:
    Description: Value for the Product Tag
    Type: String
    Default: "GOV.UK Sign In"

  OwnerTagValue:
    Description: Value for the Owner Tag
    Type: String
    Default: "govuk-accounts-tech@digital.cabinet-office.gov.uk"

  SourceTagValue:
    Description: Value for the Source Tag
    Type: String
    Default: "alphagov/di-accounts-infra/sessions-dynamodb/template.yaml"

  CodeSigningConfigArn:
    Type: String
    Description: "The ARN of the Code Signing Config to use, provided by the deployment pipeline"
    Default: "none"

  PermissionsBoundary:
    Type: String
    Description: "The ARN of the permissions boundary to apply to any role created by the template"
    Default: "none"

  SystemTagValue:
    Type: String
    Description: Value for the System Tag
    Default: Accounts

Conditions:
  IsProduction: !Equals [ !Ref Environment, production ]
  UsePermissionsBoundary:
    Fn::Not:
      - Fn::Equals:
          - !Ref PermissionsBoundary
          - "none"

  #
  # DynamoDB
  #
Resources:

  SessionsDynamoDB:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        -
          AttributeName: "id"
          AttributeType: "S"
        -
          AttributeName: "subjectId"
          AttributeType: "S"
      BillingMode: PROVISIONED
      ContributorInsightsSpecification:
        Enabled: true
      GlobalSecondaryIndexes: # Karla - not just primary key indexing - TBC
        IndexName: "subjectIdIndex"
        KeySchema:
          AttributeName: "subjectId"
          KeyType: "HASH"
        Projection:
          ProjectionType: KEYS_ONLY
#        ProvisionedThroughput:
#            ReadCapacityUnits: Integer
#            WriteCapacityUnits: Integer
      # ImportSourceSpecification: #properties of data being imported from the S3 bucket to table.
      #        InputCompressionType: String #GZIP | NONE | ZSTD ???
      #        InputFormat: String  # CSV | >DYNAMODB_JSON<  | ION
      #        InputFormatOptions:
      #        Csv:
      #          Csv #Figure out later?
      KeySchema:
        -
          AttributeName: "id"
          KeyType: "HASH"
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      SSESpecification:
        KMSMasterKeyId: !Ref DynamoDBKmsKey
        SSEEnabled: true
        SSEType: KMS
      TableClass: STANDARD
      TableName: !Sub ${AWS::StackName}-SessionsDynamoDB
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared
  #      TimeToLiveSpecification:
  #        AttributeName: String
  #        Enabled: Boolean #KARLA - Sessions to be deleted or not?


  DynamoDBKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key used to protect DynamoDB data in ${AWS::StackName}"
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:*
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: !Sub "dynamodb.amazonaws.com"
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource: "*"
      #            Condition:
      #              ArnLike:
      #                aws:SourceArn: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:secret:/${AWS::StackName}/Config/Session/secret"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-DynamoDBKmsKey"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue

  DynamoDBKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-DynamoDBKmsKey"
      TargetKeyId: !GetAtt DynamoDBKmsKey.Arn


