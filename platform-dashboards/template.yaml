AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  CloudWatch Dashboard and Metrics
Parameters:
  Environment:
    Description: The name of the environment to deploy to
    Type: String
    AllowedValues:
      - dev
      - build
      - staging
      - integration
      - production
  AAMApiGatewayId:
    Type: AWS::SSM::Parameter::Value<String>
    Description: The Authentication Account Management Api Gateway ID
    Default: "/account-mgmt-frontend/ApiGateway/ID"

Resources:

  ApiGatewayLatency:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardBody:
        Fn::Sub: >
          {
            "start": "-PT6H",
            "periodOverride": "inherit",
            "widgets": [{
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                    "metrics": [
                        [
                            "AWS/ApiGateway",
                            "Latency",
                            "ApiId",
                            "${AAMApiGatewayId}"
                        ]
                    ],
                    "period": 300,
                    "stat": "SampleCount",
                    "region": "${AWS::Region}",
                    "title": "API Gateway Latency",
                    "liveData": false,
                    "legend": {
                        "position": "right"
                    }
                }
            }]
          }
      DashboardName: !Sub "${AWS::StackName}-ApiGatewayLatency"
