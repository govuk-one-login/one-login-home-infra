AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  CloudWatch Dashboard and Metrics
Parameters:
  Environment:
    Description: The name of the environment to deploy to
    Type: String
    AllowedValues:
      - dev
      - build
      - staging
      - integration
      - production
  AAMApiGatewayId:
    Type: AWS::SSM::Parameter::Value<String>
    Description: The Authentication Account Management Api Gateway ID
    Default: "/account-mgmt-frontend/ApiGateway/ID"

Resources:

  AAMFrontendApplication:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardBody:
        Fn::Sub: >
          {
            "start": "-PT6H",
            "periodOverride": "inherit",
            "widgets": [{
              "height": 6,
              "width": 12,
              "y": 0,
              "x": 0,
              "type": "metric",
              "properties": {
                "title": "API Gateway 4xx and 5xx Errors",
                "region": "${AWS::Region}",
                "metrics": [
                  [
                      "AWS/ApiGateway",
                      "4xx",
                      "ApiId",
                      "${AAMApiGatewayId}"
                  ],
                  [
                      "AWS/ApiGateway",
                      "5xx",
                      "ApiId",
                      "${AAMApiGatewayId}"
                  ]
                ],
                "view": "timeSeries",
                "stacked": false
              }
            },
              {
                "height": 6,
                "width": 12,
                "y": 0,
                "x": 12,
                "type": "metric",
                "properties": {
                  "title": "API Gateway Latency",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                        "AWS/ApiGateway",
                        "Latency",
                        "ApiId",
                        "${AAMApiGatewayId}"
                    ]
                  ],
                  "view": "timeSeries",
                  "stacked": false
                }
              }
            ]
          }
      DashboardName: !Sub "${AWS::StackName}-AAMFrontendApplication"
