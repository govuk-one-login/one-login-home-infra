          - Effect: "Allow"
            Action:
              - "cloudformation:DescribeStacks"
            Resource:
              - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/dev-*-${SAMStackName}/*"
          - Effect: "Allow"
            Action:
              - "ssm:GetParameter*"
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tests/dev-*-${SAMStackName}/*"
          - !If
            - NotProduction
            - Effect: "Allow"
              Action:
                - "secretsmanager:GetSecretValue"  # pragma: allowlist secret
              Resource:
                - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*"
            - !Ref AWS::NoValue
          - !If
            - CreateCustomKMSKeyPolicy
            - Sid: "CustomKMSKeySigning"
              Effect: "Allow"
              Action:
                - "kms:DescribeKey"
                - "kms:GetPublicKey"
                - "kms:Decrypt"
                - "kms:Verify"
              Resource: !Ref "CustomKmsKeyArns"
            - !Ref AWS::NoValue
          - Effect: "Allow"
            Action:
              - "logs:DescribeLogGroups"
              - "logs:DescribeLogStreams"
              - "logs:DescribeMetricFilters"
              - "logs:FilterLogEvents"
              - "logs:GetLogEvents"
              - "logs:StartQuery"
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*:*"
          - Effect: "Allow"
            Action:
              - "logs:DescribeQueries"
              - "logs:DescribeQueryDefinitions"
              - "logs:GetLogDelivery"
              - "logs:GetLogRecord"
              - "logs:GetQueryResults"
              - "logs:ListLogDeliveries"
              - "logs:StopQuery"
              - "logs:TestMetricFilter"
            Resource:
              - "*"

  TestRole:
    Type: AWS::IAM::Role
    Condition: CreateTestAction
    Properties:
      # The role name is designed to ensure that it cannot match a role name
      # that a template is allowed to create/modify as otherwise the template
      # could modify the role that is used to execute it leading to a privilege
      # escalation vulnerability.
      RoleName:
        Fn::Join:
          - "-"
          - - "PL"
            - !Ref AWS::StackName
            - "TestRole"
            - Fn::Select:
                - 4
                - Fn::Split:
                    - "-"
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - "/"
                            - Ref: AWS::StackId
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "codebuild.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref CodeBuildPolicy
        - !Ref TestPolicy
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
        - !Ref LockToRegionPolicy
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-TestRole"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "alphagov/di-accounts-infra/dev-instance-pipeline/template.yaml"

  TestCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Condition: CreateTestAction
    Properties:
      Name: !Sub "Test-${AWS::StackName}"
      ServiceRole: !GetAtt TestRole.Arn
      Artifacts:
        Type: "CODEPIPELINE"
      Environment:
        ComputeType: "BUILD_GENERAL1_SMALL"
        Image: !Sub "${TestImageRepositoryUri}:latest"
        Type: "LINUX_CONTAINER"
        ImagePullCredentialsType: "SERVICE_ROLE"
      Source:
        Type: "CODEPIPELINE"
        BuildSpec: !Sub |
          version: 0.2

          env:
            variables:
              TEST_REPORT_DIR: results

          phases:
            pre_build:
              commands:
                - mkdir -p "$TEST_REPORT_DIR"

            build:
              commands:
                - |
                  export ENVIRONMENT_NUMBER=$(cat config.properties | grep environmentNumber | cut -d':' -f2)
                  echo $ENVIRONMENT_NUMBER

                - |
                  aws cloudformation describe-stacks --stack-name "dev-$ENVIRONMENT_NUMBER-${SAMStackName}" --region "${AWS::Region}" --query 'Stacks[0].Outputs[].{key: OutputKey, value: OutputValue}' --output text > cf-output.txt

                - |
                  eval $(awk '{ printf("export CFN_%s=\"%s\"\n", $1, $2) }' cf-output.txt)
                - export TEST_REPORT_ABSOLUTE_DIR="$(pwd)/$TEST_REPORT_DIR"
                - export TEST_ENVIRONMENT="${Environment}"
                - export SAM_STACK_NAME="dev-$ENVIRONMENT_NUMBER-${SAMStackName}"
                - /run-tests.sh

          reports:
            TestReports:
              files:
                - results/**/*
              file-format: ${TestReportFormat}
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-TestCodeBuildProject"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "alphagov/di-accounts-infra/dev-instance-pipeline/template.yaml"

  TestCodeBuildProjectLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateTestAction
    Properties:
      KmsKeyId: !GetAtt LogsKmsKey.Arn
      LogGroupName: !Sub "/aws/codebuild/${TestCodeBuildProject}"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-TestCodeBuildProjectLogGroup"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "alphagov/di-accounts-infra/dev-instance-pipeline/template.yaml"

  #
  # Promotion (CodeBuild)
  #

  PromotionPolicy:
    Condition: CreatePromoteStage
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Join:
          - "-"
          - - !Ref AWS::StackName
            - "PromotionPolicy"
            - Fn::Select:
                - 4
                - Fn::Split:
                    - "-"
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - "/"
                            - Ref: AWS::StackId
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Resource:
              - !If
                - CreateGitHubActionsResources
                - !GetAtt GitHubArtifactSourceBucket.Arn
                - !Ref ArtifactSourceBucketArn
              - !If
                - CreateGitHubActionsResources
                - !Sub "${GitHubArtifactSourceBucket.Arn}/*"
                - !Sub "${ArtifactSourceBucketArn}/*"
            Action:
              - "s3:GetObject"
              - "s3:GetObjectVersion"
              - "s3:GetBucketVersioning"
              - "s3:ListBucket"
              - "s3:ListBucketVersions"
            Effect: "Allow"
          - Resource:
              - !GetAtt ArtifactPromotionBucket.Arn
              - !Sub "${ArtifactPromotionBucket.Arn}/*"
            Action:
              - "s3:GetObject"
              - "s3:GetObjectVersion"
              - "s3:GetObjectTagging"
              - "s3:PutObject"
              - "s3:PutObjectAcl"
              - "s3:ListBucket"
            Effect: "Allow"
          - Resource:
              - !Sub "arn:${AWS::Partition}:s3:::template-storage-templatebucket-1upzyw6v9cs42"
              - !Sub "arn:${AWS::Partition}:s3:::template-storage-templatebucket-1upzyw6v9cs42/*"
            Action:
              - "s3:GetObject"
              - "s3:GetObjectVersion"
              - "s3:GetObjectTagging"
              - "s3:ListBucket"
            Effect: "Allow"

  PromotionRole:
    Condition: CreatePromoteStage
    Type: AWS::IAM::Role
    Properties:
      # The role name is designed to ensure that it cannot match a role name
      # that a template is allowed to create/modify as otherwise the template
      # could modify the role that is used to execute it leading to a privilege
      # escalation vulnerability.
      RoleName:
        Fn::Join:
          - "-"
          - - "PL"
            - !Ref AWS::StackName
            - "PromotionRole"
            - Fn::Select:
                - 4
                - Fn::Split:
                    - "-"
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - "/"
                            - Ref: AWS::StackId
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "codebuild.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref CodeBuildPolicy
        - !Ref PromotionPolicy
        - !Ref LockToRegionPolicy
      Tags:
        - Key: "Name"
          Value: !Join
            - "-"
            - - !Ref AWS::StackName
              - "PromotionRole"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "alphagov/di-accounts-infra/dev-instance-pipeline/template.yaml"

  PromotionCodeBuildProject:
    Condition: CreatePromoteStage
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "Promotion-${AWS::StackName}"
      ServiceRole: !GetAtt PromotionRole.Arn
      Artifacts:
        Type: "CODEPIPELINE"
      Environment:
        ComputeType: "BUILD_GENERAL1_SMALL"
        Image: "aws/codebuild/amazonlinux2-x86_64-standard:3.0"
        Type: "LINUX_CONTAINER"
      Source:
        Type: "CODEPIPELINE"
        BuildSpec: !Sub
          - |
            version: 0.2
            env:
              variables:
                PROMOTION_BUCKET_NAME: "${PromotionBucketName}"
                SOURCE_ARTIFACT_BUCKET_NAME: "${ArtifactBucket}"
            phases:
              install:
                runtime-versions:
                  python: 3.x
              pre_build:
                commands:
                  - pip install -r "$CODEBUILD_SRC_DIR_PromotionScript/requirements.txt"
              build:
                commands:
                  - |
                    echo "Deploying using devplatform sam-deploy-pipeline version: v1.15.0"
                  - PYTHONPATH=$CODEBUILD_SRC_DIR_PromotionScript python -c "import promote; promote.main('$PROMOTION_BUCKET_NAME', '$SOURCE_ARTIFACT_BUCKET_NAME', '$CODEBUILD_RESOLVED_SOURCE_VERSION')"
          - PromotionBucketName: !Select [5, !Split [':', !GetAtt ArtifactPromotionBucket.Arn]]
            ArtifactBucket: !If
              - CreateGitHubActionsResources
              - !Ref GitHubArtifactSourceBucket
              - !Select [ 5, !Split [ ':', !Ref ArtifactSourceBucketArn ] ]
      SecondarySources:
        - Type: S3
          Location: "template-storage-templatebucket-1upzyw6v9cs42/sam-deploy-pipeline/promotion_sources.zip"
          SourceIdentifier: PromotionScript
      SecondarySourceVersions:
        - SourceIdentifier: PromotionScript
          SourceVersion: "gTsbGDt5_K2hnEsF5e8Xe.f3QtyrxJOq"
      Tags:
        - Key: "Name"
          Value: !Join
            - "-"
            - - !Ref AWS::StackName
              - "PromotionCodeBuildProject"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "alphagov/di-accounts-infra/dev-instance-pipeline/template.yaml"

  PromotionCodeBuildProjectLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreatePromoteStage
    Properties:
      KmsKeyId: !GetAtt LogsKmsKey.Arn
      LogGroupName: !Sub "/aws/codebuild/${PromotionCodeBuildProject}"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-PromotionCodeBuildProjectLogGroup"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "alphagov/di-accounts-infra/dev-instance-pipeline/template.yaml"

  #
  # Pipeline
  #

  PipelineBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: artifactBucketExpiry
            Status: Enabled
            ExpirationInDays: 180
      VersioningConfiguration:
        Status: "Enabled"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: "pipeline/"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "AES256"
      Tags:
        - Key: "Name"
          Value: !Join
            - "-"
            - - !Ref AWS::StackName
              - "pipelinebucket"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "alphagov/di-accounts-infra/dev-instance-pipeline/template.yaml"

  PipelineBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PipelineBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Deny"
            Resource:
              - !GetAtt PipelineBucket.Arn
              - !Sub "${PipelineBucket.Arn}/*"
            Principal: "*"
            Action: "*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  CodePipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Join:
          - "-"
          - - !Ref AWS::StackName
            - "CodePipelinePolicy"
            - Fn::Select:
                - 4
                - Fn::Split:
                    - "-"
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - "/"
                            - Ref: AWS::StackId
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Resource:
              - !If
                - CreateGitHubActionsResources
                - !GetAtt GitHubArtifactSourceBucket.Arn
                - !Ref ArtifactSourceBucketArn
              - !If
                - CreateGitHubActionsResources
                - !Sub "${GitHubArtifactSourceBucket.Arn}/*"
                - !Sub "${ArtifactSourceBucketArn}/*"
            Action:
              - "s3:GetObject"
              - "s3:GetObjectVersion"
              - "s3:GetBucketVersioning"
            Effect: "Allow"
          - Resource:
              - !GetAtt PipelineBucket.Arn
              - !Sub "${PipelineBucket.Arn}/*"
            Action:
              - "s3:GetObject"
              - "s3:GetObjectVersion"
              - "s3:GetBucketVersioning"
              - "s3:PutObjectAcl"
              - "s3:PutObject"
            Effect: "Allow"
          - Resource:
              - !GetAtt DeployCodeBuildProject.Arn
              - !If [CreateTestContainerSignatureValidateStage, !GetAtt ValidateSignatureCodeBuildProject.Arn, !Ref "AWS::NoValue"]
              - !If [CreateTestAction, !GetAtt TestCodeBuildProject.Arn, !Ref "AWS::NoValue"]
              - !If [CreatePromoteStage, !GetAtt PromotionCodeBuildProject.Arn, !Ref "AWS::NoValue"]
            Action:
              - "codebuild:BatchGetBuilds"
              - "codebuild:StartBuild"
              - "codebuild:BatchGetBuildBatches"
              - "codebuild:StartBuildBatch"
            Effect: "Allow"

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "codepipeline.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref CodePipelinePolicy
        - !Ref LockToRegionPolicy
      Tags:
        - Key: "Name"
          Value: !Join
            - "-"
            - - !Ref AWS::StackName
              - "CodePipelineRole"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "alphagov/di-accounts-infra/dev-instance-pipeline/template.yaml"

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: "S3"
        Location: !Ref PipelineBucket
      Stages:
        - Name: "Fetch"
          Actions:
            - Name: "Get-Artifacts"
              ActionTypeId:
                Category: "Source"
                Version: "1"
                Provider: "S3"
                Owner: "AWS"
              Configuration:
                S3Bucket: !If
                  - CreateGitHubActionsResources
                  - !Ref GitHubArtifactSourceBucket
                  - !Select [5, !Split [':', !Ref ArtifactSourceBucketArn]]
                S3ObjectKey: "template.zip"
              OutputArtifacts:
                - Name: "sam-artifacts"
        - !If
          - CreateManualApprovalStage
          - Name: "Approval"
            Actions:
              - Name: "Deploy-Approval"
                ActionTypeId:
                  Category: "Approval"
                  Version: "1"
                  Provider: "Manual"
                  Owner: "AWS"
                Configuration:
                  CustomData: "Click approve to proceed to Deploy stage"
          - !Ref AWS::NoValue
        - Name: "Deploy"
          Actions:
            - Name: "Deploy"
              ActionTypeId:
                Category: "Build"
                Version: "1"
                Provider: "CodeBuild"
                Owner: "AWS"
              Configuration:
                ProjectName: !Ref DeployCodeBuildProject
              InputArtifacts:
                - Name: "sam-artifacts"
              RunOrder: 1
            - !If
              - CreateTestContainerSignatureValidateStage
              - Name: ValidateTestSignature
                ActionTypeId:
                  Category: "Build"
                  Version: "1"
                  Provider: "CodeBuild"
                  Owner: "AWS"
                Configuration:
                  ProjectName: !Ref ValidateSignatureCodeBuildProject
                InputArtifacts:
                  - Name: "sam-artifacts"
                RunOrder: 2
              - !Ref AWS::NoValue
            - !If
              - CreateTestAction
              - Name: Test
                ActionTypeId:
                  Category: "Build"
                  Version: "1"
                  Provider: "CodeBuild"
                  Owner: "AWS"
                Configuration:
                  ProjectName: !Ref TestCodeBuildProject
                InputArtifacts:
                  - Name: "sam-artifacts"
                RunOrder: 3
              - !Ref AWS::NoValue
        - !If
          - CreatePromoteStage
          - Name: "Promote"
            Actions:
              - Name: "Promote"
                ActionTypeId:
                  Category: "Build"
                  Version: "1"
                  Provider: "CodeBuild"
                  Owner: "AWS"
                Configuration:
                  ProjectName: !Ref PromotionCodeBuildProject
                InputArtifacts:
                  - Name: "sam-artifacts"
          - !Ref AWS::NoValue
      Tags:
        - Key: "Name"
          Value: !Join
            - "-"
            - - !Ref AWS::StackName
              - "Pipeline"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "alphagov/di-accounts-infra/dev-instance-pipeline/template.yaml"

  #
  # Slack build notification rule
  #

  NotificationRule:
    Type: AWS::CodeStarNotifications::NotificationRule
    Condition: EmitBuildNotifications
    Properties:
      Name: !Sub "${AWS::StackName}-build-notifications"
      Resource: !Sub
        - "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
        - Pipeline: !Ref Pipeline
      DetailType: "BASIC"
      EventTypeIds:
        !FindInMap [ BuildNotifications, !Ref SlackNotificationType, "EventTypeIds" ]
      Targets:
        - TargetType: "SNS"
          TargetAddress:
            Fn::ImportValue:
              !Sub "${BuildNotificationStackName}-BuildNotificationTopicArn"
