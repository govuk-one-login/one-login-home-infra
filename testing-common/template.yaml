      Description: "OTP Username secret used to run QA tests against the Account Management Frontend"
      SecretString: "please-set-me"
      KmsKeyId: !GetAtt SecretsKmsKey.KeyId
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
