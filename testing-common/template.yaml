AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The CloudFormation template creates the prerequisite Testing Common resources used by QA Team to execute tests.
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Description: The name of the environment to deploy to.
    Type: String
    AllowedValues:
      - "dev"
      - "build"
      - "staging"
      - "integration"
  ProductTagValue:
    Description: Value for the Product Tag
    Type: String
    Default: GOV.UK Sign In
  SystemTagValue:
    Description: Value for the System Tag
    Type: String
    Default: Accounts Testing
  OwnerTagValue:
    Description: Value for the Owner Tag
    Type: String
    Default: govuk-accounts-tech@digital.cabinet-office.gov.uk
  SourceTagValue:
    Description: Value for the Source Tag
    Type: String
    Default: alphagov/di-accounts-infra/testing-common/template.yaml
  AMFStackName:
    Description: The name of the Account Management Frontend stack
    Type: String
    Default: account-mgmt-frontend

Resources:
  #
  # Secrets and SSM Parameters
  #
  AuthenticatorOTPUsernameSecretOne:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/tests/${AMFStackName}/Config/OTP/UsernameOne"
      Description: "For setting the UsernameOne env var config value. This is the email address of the account holder."
      SecretString: "please-set-me"
      KmsKeyId: !GetAtt SecretsKmsKey.KeyId
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue

  AuthenticatorOTPUsernameSecretTwo:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/tests/${AMFStackName}/Config/OTP/UsernameTwo"
      Description: "For setting the UsernameTwo env var config value. This is the email address of the account holder."
      SecretString: "please-set-me"
      KmsKeyId: !GetAtt SecretsKmsKey.KeyId
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue

  EnvironmentSecretKeyUserSecretOne:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/tests/${AMFStackName}/Config/KeyUser/UsernameOne"
      Description: !Sub "For setting the ${Environment} env var value for UsernameOne's configuration value."
      SecretString: "please-set-me"
      KmsKeyId: !GetAtt SecretsKmsKey.KeyId
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue

  EnvironmentSecretKeyUserSecretTwo:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/tests/${AMFStackName}/Config/KeyUser/UsernameTwo"
      Description: !Sub "For setting the ${Environment} env var value for UsernameTwo's configuration value."
      SecretString: "please-set-me"
      KmsKeyId: !GetAtt SecretsKmsKey.KeyId
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue

  SignInPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/tests/${AMFStackName}/Config/SignIn/Password"
      Description: "For setting the SignIn password env var config value."
      SecretString: "please-set-me"
      KmsKeyId: !GetAtt SecretsKmsKey.KeyId
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue

  NewSignInPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/tests/${AMFStackName}/Config/SignIn/NewPassword"
      Description: "For setting the NewPassword env var config value."
      SecretString: "please-set-me"
      KmsKeyId: !GetAtt SecretsKmsKey.KeyId
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue

  InvalidPasswordSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Description: "SSM for invalid password env var configuration value."
      Name: !Sub "/tests/${AMFStackName}/Config/SignIn/InvalidPassword"
      Type: String
      Value: "please-set-me"
      Tags:
        Environment: !Ref Environment
        Product: !Ref ProductTagValue
        System: !Ref SystemTagValue
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue

  #
  # KMS
  #
  SecretsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key used to protect secrets parameters created in ${AWS::StackName}"
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:*
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource: "*"
            Condition:
              ArnLike:
                aws:SourceArn:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/tests/${AMFStackName}/Config/*"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-SecretsKmsKey"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CacheLoggingKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-SecretsKmsKey"
      TargetKeyId: !GetAtt SecretsKmsKey.Arn
