AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ElastiCache Redis - Cluster Mode Disabled.

Parameters:
  Environment:
    Description: "The name of the environment to deploy to"
    Type: "String"
    Default: build
    AllowedValues:
      - "dev"
      - "build"
      - "staging"
      - "integration"
      - "production"

  VpcStackName:
    Description: "The name of the stack that defines the VPC where this Redis cluster will be deployed"
    Type: String
    Default: "vpc-enhanced"

  NodeCount:
    Description: "Number of Cache Cluster required - one per AZ"
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 6

  ProductTagValue:
    Description: Value for the Product Tag
    Type: String
    Default: "GOV.UK Sign In"

  OwnerTagValue:
    Description: Value for the Owner Tag
    Type: String
    Default: "govuk-accounts-tech@digital.cabinet-office.gov.uk"

  SourceTagValue:
    Description: Value for the Source Tag
    Type: String
    Default: "alphagov/di-accounts-infra/shared-redis/template.yaml"

Conditions:
  IsProduction: !Equals [ !Ref Environment, production ]

Resources:

  # Cache Logging
  CacheLoggingKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key used to protect logging data created in ${AWS::StackName}"
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:*
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn":
                  !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/elasticache/shared-redis/cluster"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-CacheLoggingKmsKey"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CacheLoggingKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-CacheLoggingKmsKey"
      TargetKeyId: !GetAtt CacheLoggingKmsKey.Arn

  CacheLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt CacheLoggingKmsKey.Arn
      LogGroupName: !Sub "/elasticache/${AWS::StackName}/cluster"
      RetentionInDays: 3
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-CacheLogGroup"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  # Cache Secret
  SecretsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key used to protect secrets data created in ${AWS::StackName}"
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:*
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/Config/Cache/Password*"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-SecretsKmsKey"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  SecretsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-SecretsKmsKey"
      TargetKeyId: !GetAtt SecretsKmsKey.Arn

  CachePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${AWS::StackName}/Cluster/Password"
      Description: !Sub Random password for the ${AWS::StackName} cache
      GenerateSecretString:
        ExcludeLowercase: false
        ExcludeNumbers: false
        ExcludePunctuation: true
        ExcludeUppercase: false
        IncludeSpace: false
        RequireEachIncludedType: true
        PasswordLength: 32
      KmsKeyId: !GetAtt SecretsKmsKey.Arn
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "/${AWS::StackName}/Cluster/Password"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  # Cache & Cache Config
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub ${AWS::StackName}-CacheSubnetGroup
      Description: !Sub "Subnet Group for the ${AWS::StackName} cache"
      SubnetIds:
        - Fn::ImportValue:
            !Sub "${VpcStackName}-PrivateSubnetIdA"
        - Fn::ImportValue:
            !Sub "${VpcStackName}-PrivateSubnetIdB"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-CacheSubnetGroup"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CacheReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      AtRestEncryptionEnabled: true
      AuthToken: !Sub '{{resolve:secretsmanager:${CachePasswordSecret}}}'
      AutomaticFailoverEnabled: true
      CacheNodeType: !If
        - IsProduction
        - "cache.m4.xlarge"
        - "cache.t3.micro"
      CacheParameterGroupName: "default.redis6.x"
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      Engine: redis
      EngineVersion: 6.x
      LogDeliveryConfigurations:
        - DestinationDetails:
            CloudWatchLogsDetails:
              LogGroup: !Ref CacheLogGroup
          DestinationType: cloudwatch-logs
          LogFormat: json
          LogType: engine-log
      MultiAZEnabled: true
      NumCacheClusters: !Ref NodeCount
      #      NotificationTopicArn:  TODO Create SNS topic and reference
      PreferredMaintenanceWindow: "mon:02:00-mon:03:00"
      Port: 6379
      ReplicationGroupDescription: !Sub Replication group for the ${AWS::StackName} cache
      ReplicationGroupId: !Sub "${AWS::StackName}-CacheCluster"
      SecurityGroupIds:
        - !GetAtt CacheSecurityGroup.GroupId
      TransitEncryptionEnabled: true
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-CacheReplicationGroup"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared
    DependsOn: CachePasswordSecret

  # Cache Security Group Ingress Protection
  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-CacheSecurityGroup"
      GroupDescription: !Sub "${AWS::StackName} security group to allow ingress access to the Cache cluster from private and protected subnets"
      VpcId:
        Fn::ImportValue:
          !Sub "${VpcStackName}-VpcId"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-CacheSecurityGroup"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  IngressRedisFromPrivateSubnetA:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow traffic from Private Subnet A
      CidrIp: "10.0.10.0/23"
      FromPort: 6379
      GroupId: !GetAtt CacheSecurityGroup.GroupId
      IpProtocol: tcp
      ToPort: 6379

  IngressRedisFromPrivateSubnetB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow traffic from Private Subnet B
      CidrIp: "10.0.12.0/23"
      FromPort: 6379
      GroupId: !GetAtt CacheSecurityGroup.GroupId
      IpProtocol: tcp
      ToPort: 6379

  IngressRedisFromProtectedSubnetA:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow traffic from Protected Subnet A
      CidrIp: "10.0.4.0/23"
      FromPort: 6379
      GroupId: !GetAtt CacheSecurityGroup.GroupId
      IpProtocol: tcp
      ToPort: 6379

  IngressRedisFromProtectedSubnetB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow traffic from Protected Subnet B
      CidrIp: "10.0.6.0/23"
      FromPort: 6379
      GroupId: !GetAtt CacheSecurityGroup.GroupId
      IpProtocol: tcp
      ToPort: 6379

  # Stack State in SSM Parameters
  CachePasswordSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The ARN of the Cache's password secret
      Name: !Sub "/${AWS::StackName}/Cluster/Password/Secret"
      Type: String
      Value: !Ref CachePasswordSecret
      Tags:
        Product: !Ref ProductTagValue
        System: Accounts
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        Application: Shared

  CacheEndpointAddressParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The DNS hostname of the primary cache node
      Name: !Sub "/${AWS::StackName}/Cluster/Primary/Address"
      Type: String
      Value: !GetAtt CacheReplicationGroup.PrimaryEndPoint.Address
      Tags:
        Product: !Ref ProductTagValue
        System: Accounts
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        Application: Shared

  CacheEndpointPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The port number that the cache engine is listening on
      Name: !Sub "/${AWS::StackName}/Cluster/Primary/Port"
      Type: String
      Value: !GetAtt CacheReplicationGroup.PrimaryEndPoint.Port
      Tags:
        Product: !Ref ProductTagValue
        System: Accounts
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        Application: Shared

  # LEGACY: these are here to allow app.ts -> getRedisConfig to work
  LegacyCachePasswordSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: !Sub Random password for the ${AWS::StackName} cache
      Name: !Sub "${Environment}-${AWS::StackName}-redis-password"
      Type: String
      Value: !Sub '{{resolve:secretsmanager:${CachePasswordSecret}}}'
      Tags:
        Product: !Ref ProductTagValue
        System: Accounts
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        Application: Shared

  LegacyCacheEndpointAddressParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The DNS hostname of the primary cache node
      Name: !Sub "${Environment}-${AWS::StackName}-redis-master-host"
      Type: String
      Value: !GetAtt CacheReplicationGroup.PrimaryEndPoint.Address
      Tags:
        Product: !Ref ProductTagValue
        System: Accounts
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        Application: Shared

  LegacyCacheEndpointPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The port number that the cache engine is listening on
      Name: !Sub "${Environment}-${AWS::StackName}-redis-port"
      Type: String
      Value: !GetAtt CacheReplicationGroup.PrimaryEndPoint.Port
      Tags:
        Product: !Ref ProductTagValue
        System: Accounts
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        Application: Shared
