AWSTemplateFormatVersion: '2010-09-09'

Description: A clustered Redis cache.

Parameters:
  Environment:
    Description: "The name of the environment to deploy to"
    Type: "String"
    Default: build
    AllowedValues:
      - "dev"
      - "build"
      - "staging"
      - "integration"
      - "production"

  VpcStackName:
    Description: >
      The name of the stack that defines the VPC where this redis cluster will be
      deployed.
    Type: String
    Default: "vpc"

  CacheNodeType:
    Description: 'The type of node used in the node group (shard).'
    Type: 'String'
    Default: 'cache.t3.micro'

  ProductTagValue:
    Description: Value for the Product Tag
    Type: String
    Default: "GOV.UK Sign In"

  OwnerTagValue:
    Description: Value for the Owner Tag
    Type: String
    Default: govuk-accounts-tech@digital.cabinet-office.gov.uk

  SourceTagValue:
    Description: Value for the Source Tag
    Type: String
    Default: alphagov/di-accounts-infra/shared-redis/template.yaml

  CodeSigningConfigArn:
    Type: String
    Description: >
      The ARN of the Code Signing Config to use, provided by the deployment pipeline
    Default: "none"

  PermissionsBoundary:
    Type: String
    Description: >
      The ARN of the permissions boundary to apply to any role created by the template
    Default: "none"

Conditions:
  UseCodeSigning:
    Fn::Not:
      - Fn::Equals:
          - !Ref CodeSigningConfigArn
          - "none"

  UsePermissionsBoundary:
    Fn::Not:
      - Fn::Equals:
          - !Ref PermissionsBoundary
          - "none"

Resources:
  KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub KMS key used to protect cache and logging data created in ${AWS::StackName}
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:*
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-kms-key"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CacheLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt KmsKey.Arn
      LogGroupName: !Sub "/elasticache/${AWS::StackName}/cluster"
      RetentionInDays: 3
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-logs"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CachePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-cache-password
      Description: !Sub Random password for the ${AWS::StackName} cache
      GenerateSecretString:
        ExcludeLowercase: false
        ExcludeNumbers: false
        ExcludePunctuation: true
        ExcludeUppercase: false
        IncludeSpace: false
        RequireEachIncludedType: true
        PasswordLength: 32
      KmsKeyId: !GetAtt KmsKey.Arn
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-password"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub ${AWS::StackName}-cache-subnet-group
      Description: !Sub Subnet Group for the ${AWS::StackName} cache
      SubnetIds:
        - Fn::ImportValue:
            !Sub "${VpcStackName}-PrivateSubnetIdA"
        - Fn::ImportValue:
            !Sub "${VpcStackName}-PrivateSubnetIdB"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-subnet-group"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CacheParameterGroup:
    Type: AWS::ElastiCache::ParameterGroup
    Properties:
      CacheParameterGroupFamily: redis6.x
      Description: !Sub ${AWS::StackName} cache settings
      Properties:
        cluster-enabled: "yes"
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub ${AWS::StackName}-cache-parameter-group
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CacheReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      AtRestEncryptionEnabled: true
      AuthToken: !Sub '{{resolve:secretsmanager:${CachePasswordSecret}}}'
      AutomaticFailoverEnabled: true
      CacheNodeType: !Ref CacheNodeType
      CacheParameterGroupName: !Ref CacheParameterGroup
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      Engine: redis
      EngineVersion: 6.x
      LogDeliveryConfigurations:
        - DestinationDetails:
            CloudWatchLogsDetails:
              LogGroup: !Ref CacheLogGroup
          DestinationType: cloudwatch-logs
          LogFormat: json
          LogType: engine-log
      MultiAZEnabled: true
      #      NotificationTopicArn:  TODO
      NumNodeGroups: 1
      PreferredMaintenanceWindow: "mon:02:00-mon:03:00"
      Port: 6379
      ReplicasPerNodeGroup: 1
      ReplicationGroupDescription: !Sub Replication group for the ${AWS::StackName} cache
      ReplicationGroupId: !Sub "${AWS::StackName}-cache-cluster"
      SecurityGroupIds:
        - Fn::ImportValue:
            !Sub "${VpcStackName}-AWSServicesEndpointSecurityGroupId"
      TransitEncryptionEnabled: true
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-replication-group"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${AWS::StackName}-cache-sg
      GroupDescription: Security group to allow access to the Cache cluster from private subnets only
      VpcId:
        Fn::ImportValue:
          !Sub "${VpcStackName}-VpcId"
      SecurityGroupIngress:
        - Description: Allow traffic from Private Subnet A
          CidrIp: "10.0.10.0/23" # TODO - get CIDR groups using Cidr func with same properties for subnet using published the VPC cidr as seed
          IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
        - Description: Allow traffic from Private Subnet B
          CidrIp: "10.0.12.0/23" # TODO - get CIDR groups using Cidr func with same properties for subnet using published the VPC cidr as seed
          IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: Accounts
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-sg"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue
        - Key: Application
          Value: Shared

  CachePasswordSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The ARN of the Cache's password secret
      Name: !Sub "/${Environment}/${AWS::StackName}/Cluster/Secret/ARN"
      Type: String
      Value: !Ref CachePasswordSecret
      Tags:
        Product: !Ref ProductTagValue
        System: Accounts
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        Application: Shared


  CacheEndpointAddressParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The DNS hostname of the cache node
      Name: !Sub "/${Environment}/${AWS::StackName}/Cluster/Endpoint/Address"
      Type: String
      Value: !GetAtt CacheReplicationGroup.ConfigurationEndPoint.Address
      Tags:
        Product: !Ref ProductTagValue
        System: Accounts
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        Application: Shared

  CacheEndpointPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: The port number that the cache engine is listening on
      Name: !Sub "/${Environment}/${AWS::StackName}/Cluster/Endpoint/Port"
      Type: String
      Value: !GetAtt CacheReplicationGroup.ConfigurationEndPoint.Port
      Tags:
        Product: !Ref ProductTagValue
        System: Accounts
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue
        Application: Shared