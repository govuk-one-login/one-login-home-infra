name: Checkov

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@eec884fd62682f5f2b33e303e160d5e2fe8d89ec # v12.3052.0 
        with:
          directory: .
          skip_check: CKV2_GHA_1,CKV_SECRET_6,CKV_AWS_124,CKV_TF_1,CKV_TF_2 # CKV2_GHA_1: permissions inherited from org settings, CKV_SECRET_6: placeholder value not a real secret, CKV_AWS_124: SNS notifications managed externally, CKV_TF_1/CKV_TF_2: internal org modules without pinned versions
          soft_fail: false
          output_format: cli
          output_file_path: console
     
