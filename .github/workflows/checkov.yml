name: Checkov

on:
  pull_request:
  merge_group:

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@fa9edf8f0a491c59a924ea6accd5bdcf07752cff # v12.3107.0
        with:
          directory: .
          output_format: cli
          output_file_path: console
          # CKV2_GHA_1: permissions inherited from org settings,
          # CKV_SECRET_6: placeholder value not a real secret,
          # CKV_AWS_124: SNS notifications managed externally (backup-as-a-service), and
          # CKV_TF_1/CKV_TF_2: low priority - skipped intentionally. Module sources point to govuk-one-login/ipv-terraform-modules
          # which does not have automated ?ref= pin updates in consuming repos. Pinning requires manually fetching the latest
          # tags from ipv-terraform-modules (git fetch --tags) and updating each source URL with ?ref=<tag> every time a module
          # is updated. Until this is automated, the maintenance overhead outweighs the benefit.
          skip_check: CKV2_GHA_1,CKV_SECRET_6,CKV_AWS_124,CKV_TF_1,CKV_TF_2 