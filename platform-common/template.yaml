AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Externalises values referenced across multiple CloudFormation Stacks.
  This prevents having to individually update each reference of a single value across multiple Stacks.
  Values will instead resolve as SSM parameters or Secrets acting as the single source of truth.

Parameters:
  Environment:
    Description: The name of the environment to deploy to
    Type: String
    Default: dev
    AllowedValues:
      - "dev"
      - "build"
      - "staging"
      - "integration"
      - "production"
  ProductTagValue:
    Description: Value for the Product Tag
    Type: String
    Default: GOV.UK Sign In
  SystemTagValue:
    Description: Value for the System Tag
    Type: String
    Default: Account Management
  OwnerTagValue:
    Description: Value for the Owner Tag
    Type: String
    Default: govuk-accounts-tech@digital.cabinet-office.gov.uk
  SourceTagValue:
    Description: Value for the Source Tag
    Type: String
    Default: alphagov/di-accounts-infra/platform-common/template.yaml

Conditions:
  IsNotDevelopment: !Or
    - !Equals [ !Ref Environment, build ]
    - !Equals [ !Ref Environment, staging ]
    - !Equals [ !Ref Environment, integration ]
    - !Equals [ !Ref Environment, production ]

Resources:
  #
  # SSM Parameter
  #

  CSLSLogsSubscriptionARN:
    Type: AWS::SSM::Parameter
    Condition: IsNotDevelopment
    Properties:
      Description: The CSLS CloudWatch Logs Destination ARN
      Name: !Sub "/${Environment}/Platform/Logs/Subscription/CSLS"
      Type: String
      Value: "arn:aws:logs:${AWS::Region}:885513274347:destination:csls_cw_logs_destination_prodpython"
      Tags:
        Product: !Ref ProductTagValue
        System: !Ref SystemTagValue
        Environment: !Ref Environment
        Owner: !Ref OwnerTagValue
        Source: !Ref SourceTagValue

  #
  # SecretsManager
  #

  GrafanaApiKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/Config/Grafana/API/Key"
      Description: "Accounts - Grafana API Key"
      SecretString: "placeholder-value"
      KmsKeyId: !Ref SecretsEncryptionKMSKeyAlias
      Tags:
        - Key: Product
          Value: !Ref ProductTagValue
        - Key: System
          Value: !Ref SystemTagValue
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "${AWS::StackName}-GrafanaApiKey"
        - Key: Owner
          Value: !Ref OwnerTagValue
        - Key: Source
          Value: !Ref SourceTagValue

  #
  # KMS Key
  #

  SecretsEncryptionKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: >
        !Sub KMS key used to protect secret configuration values for ${AWS::StackName}.
        Required by roles who need to update config values and deploy the stack called ${AWS::StackName}.
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:*
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: !Sub "secretsmanager.amazonaws.com"
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource: "*"
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${Environment}/Config/Grafana/API/Key"

  SecretsEncryptionKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-SecretsEncryptionKMSKey"
      TargetKeyId: !Ref SecretsEncryptionKMSKey